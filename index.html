<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cafetería - Sistema de Pedidos</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Fuente premium -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body class="page">
  <div class="container py-4">
    <header class="banner text-center mb-5">
      <h1>☕ Cafetería Premium</h1>
      <p class="lead">Pedí fácil, pagá cómodo y disfrutá el mejor café.</p>
    </header>

    <main class="main-grid">
      <section class="panel panel--products">
        <div class="panel-header d-flex flex-column flex-md-row align-items-center justify-content-between gap-3 mb-4">
          <div>
            <h2 class="section-title">Productos</h2>
            <p class="section-subtitle">Elige tu bebida o snack favorito</p>
          </div>
          <div class="d-flex gap-2 flex-wrap" id="filtros">
            <button type="button" class="btn btn-outline-dark active" data-category="Todas">Todas</button>
            <button type="button" class="btn btn-outline-dark" data-category="Bebida caliente">Bebidas calientes</button>
            <button type="button" class="btn btn-outline-dark" data-category="Bebida fria">Bebidas frías</button>
            <button type="button" class="btn btn-outline-dark" data-category="Postre">Postres</button>
            <button type="button" class="btn btn-outline-dark" data-category="Comida">Comida</button>
          </div>
        </div>

        <div class="input-group mb-4">
          <span class="input-group-text">🔍</span>
          <input id="buscador" type="text" class="form-control shadow-sm" placeholder="Buscar producto...">
        </div>

        <div id="productos" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-xl-4 g-4"></div>
      </section>

      <section class="panel panel--order">
        <div class="panel-header mb-4">
          <h2 class="section-title">Tu pedido</h2>
          <p class="section-subtitle">Controla los productos y cantidades</p>
        </div>

        <div id="pedidos" class="order-list mb-4"></div>

        <div class="totales-box p-4 rounded-4 shadow-sm mb-4">
          <p class="mb-2 text-muted">Subtotal: <strong id="subtotal">Q0.00</strong></p>
          <p class="mb-2 text-muted">Impuesto (5%): <strong id="impuesto">Q0.00</strong></p>
          <h4 class="mb-4">Total: <strong id="total">Q0.00</strong></h4>
          <div class="d-flex flex-column flex-sm-row gap-3">
            <button id="vaciarPedido" class="btn btn-outline-warning w-100">Vaciar pedido</button>
            <button id="finalizarPedido" class="btn btn-custom w-100" disabled>Finalizar pedido</button>
          </div>
        </div>

        <div class="final-box rounded-4 shadow-sm p-4 bg-white d-none" id="resumenFinal">
          <h3 class="fw-bold mb-3">Pedido finalizado ✅</h3>
          <ul id="listaFinal" class="list-unstyled mb-3"></ul>
          <p class="mb-1">Total pagado: <strong id="totalFinal">Q0.00</strong></p>
          <p class="text-muted mb-0">Gracias por tu compra.</p>
        </div>
      </section>
    </main>
  </div>
  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
